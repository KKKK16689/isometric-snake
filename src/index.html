<!doctype html>
<!-- 源码模板：改样式/逻辑请改 src/css、src/js，再运行 `node build.js` 生成根目录 index.html。
     根目录 index.html 是构建产物（由 CI 校验一致性），不要直接手改。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060a14">
<meta name="description" content="等距视角的 3D 贪吃蛇：单文件、零依赖、纯 Canvas 渲染。支持双人对战、三档 AI、冲刺能量系统和夜间霓虹主题，手机电脑都能玩。">
<meta property="og:title" content="等距贪吃蛇">
<meta property="og:description" content="等距视角的 3D 贪吃蛇：双人对战、三档 AI、冲刺能量系统，单 HTML 文件即玩。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kkkk16689.github.io/isometric-snake/">
<meta property="og:image" content="https://kkkk16689.github.io/isometric-snake/screenshots/neon-night.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="霓虹夜主题下的等距贪吃蛇棋盘">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://kkkk16689.github.io/isometric-snake/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="author" content="孔垂瑞">
<meta name="application-version" content="3.0.0">
<title>等距贪吃蛇 V3.0.0</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<main>
<nav class="play-actions" aria-label="游戏操作">
<button id="menu">⌂ <span>主页</span></button><button id="pause">Ⅱ <span>暂停</span></button>
<button id="restart">↻ <span>重来</span></button><button id="help">? <span>练习</span></button>
<button id="settings" aria-expanded="false">⚙ <span>设置</span></button>
</nav>
<section id="mission-hud" aria-label="航线目标" hidden><b id="mission-title"></b><span id="mission-tip"></span><small id="mission-time"></small></section>
<div id="experience" class="experience" hidden></div>
<h1>等距贪吃蛇</h1>
<section id="preferences" role="dialog" aria-modal="true" aria-labelledby="preferences-title" hidden>
<header class="preferences-head"><h2 id="preferences-title">游戏设置</h2><button id="close-settings">返回对局</button></header>
<p class="preferences-label">地图与玩法 · 选图会重开当前对局</p>
<div class="mode">
<button data-m="easy" class="on">简单</button>
<button data-m="normal">普通</button>
<button data-m="pk" title="双人对战（同屏）">双人</button>
<button data-m="ai" title="人机对战（对手 CR）">人机</button>
<button id="aiLv">AI 普通</button>
<button id="fs" title="全屏">全屏</button>
<button id="snd" title="音效：开">音效</button>
<button id="mus" title="音乐：关">音乐</button>
<button id="vib" title="震动反馈：开">震动</button>
<button id="daily" title="每日挑战：全球同一张棋盘">每日挑战</button>
<button id="ghost" title="幽灵回放：关">幽灵</button>
        <button id="terrain" title="3D 地形：关">3D</button>
          <select id="lv" aria-label="地图" title="地图"></select>
<button id="copy" title="复制本局成绩">复制成绩</button>
<select id="spr" aria-label="冲刺音效" title="冲刺音效">
<option value="b">喷气</option>
<option value="c">蓄能</option>
<option value="f">街机</option>
<option value="g">脉冲</option>
<option value="h">引擎</option>
<option value="i">电弧</option>
</select>
</div>
<p class="preferences-label">主题</p>
<div class="th"></div>
<div class="skin-settings" data-p="0"><p class="preferences-label">蛇的颜色 · P1</p><div class="sw" data-p="0"></div></div>
<div class="skin-settings" data-p="1"><p class="preferences-label">蛇的颜色 · P2</p><div class="sw" data-p="1"></div></div>
</section>
<div class="hud"><span id="hl"></span><span id="hr"></span></div>
      <canvas id="mm" width="96" height="96" aria-hidden="true"></canvas>
<div class="stage">
<div class="pad" data-p="0">
<button class="sp" aria-label="冲刺">冲</button><button data-s="up" aria-label="上">↗</button><span></span>
<button data-s="left" aria-label="左">↖</button><button data-s="down" aria-label="下">↙</button><button data-s="right" aria-label="右">↘</button>
</div>
<canvas id="c" role="img" aria-label="等距视角的贪吃蛇棋盘"></canvas>
<div class="eb" data-p="0"><i></i></div>
<div class="eb" data-p="1"><i></i></div>
<div class="cmp" data-p="0"><b class="fd"><u></u></b><i class="hd"></i></div>
<div class="cmp" data-p="1"><b class="fd"><u></u></b><i class="hd"></i></div>
<div class="pad" data-p="1">
<button class="sp" aria-label="冲刺">冲</button><button data-s="up" aria-label="上">↗</button><span></span>
<button data-s="left" aria-label="左">↖</button><button data-s="down" aria-label="下">↙</button><button data-s="right" aria-label="右">↘</button>
</div>
</div>
<div class="rotate">请把手机横过来，开始对战</div>
<div class="hint" id="hint">像 App 一样全屏打开：<br>iPhone：Safari 点分享，再点“添加到主屏幕”<br>安卓：浏览器菜单里选“添加到主屏幕”或“安装应用”<br><span>点这里关闭</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<p class="tip">↑/W 对应右上，→/D 对应右下，↓/S 对应左下，←/A 对应左上；空格暂停。按住 Shift、E 或 Enter 冲刺，手机按住「冲」键冲刺，也可在棋盘上滑动转向。罗盘里箭头是蛇的朝向，橙点指向最近的食物。简单模式有 3 条命。</p>
</main>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/terrain.js"></script>
<script src="js/themes.js"></script>
<script src="js/patterns.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/render.js"></script>
<script src="js/ai.js"></script>
<script src="js/input.js"></script>
<script src="js/experience.js"></script>
<script>
(function () {
  'use strict';
  Snake.theme.init();
  Snake.Ai.init();
  Snake.Audio.init();
  Snake.UI.init();
  Snake.Render.boot();
  Snake.api.reset();
  if (Snake.Experience) Snake.Experience.init();
  if (new URLSearchParams(location.search).get('autostart') === '1') Snake.api.start(); // ?autostart=1：自动开赛（截图/演示用）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {   // 离线缓存：仅 http(s) 注册，file:// 双击打开静默跳过
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
