<style>
/* 默认主题（霓虹夜）变量兜底：JS 未运行时首屏即默认主题；切换由 themes.js 覆盖同名变量 */
:root{--bg:#060a14;--fg:#e6ecff;--muted:#7f8fb5;--f1:#0a1122;--f2:#0c142a;--edge:#1b2a55;--btn:#0d1530;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:0 0 8px}
.mode{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 10px}
.mode button{font-size:14px;padding:6px 16px;border-radius:999px;border:1px solid var(--edge);background:var(--btn);color:var(--fg)}
.mode button.on{background:var(--fg);color:var(--bg)}
.mode button.off{opacity:.55}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:rgba(18,22,30,.92);color:#fff;font-size:14px;line-height:1.4;padding:8px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){#toast{transition:none}.pad button:active{transform:none}.mode button,.pad button{transition:none}}
.mode select{font-size:14px;padding:6px 10px;border-radius:999px;border:1px solid var(--edge);background:var(--btn);color:var(--fg)}
#aiLv{display:none}
body.ai #aiLv{display:inline-block}
.hud{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:4px}
.hud b{color:var(--fg);font-size:18px}
.hud .c0{color:#1D9E75;font-weight:600}.hud .c1{color:#378ADD;font-weight:600}.hud .lives{color:#E24B4A}
.hud .combo{color:#EF9F27;font-weight:600}
.stage{display:flex;flex-direction:column;align-items:center}
canvas{display:block;width:100%;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px;max-width:100%;margin:12px auto;order:2}
.pad[data-p="1"]{display:none}
.pad button{font-size:26px;padding:14px 0;border-radius:12px;border:1px solid var(--edge);background:var(--btn);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.pad button:active{transform:scale(.96)}
.tip{color:var(--muted);font-size:13px;text-align:center;margin:0}
.rotate{display:none;text-align:center;color:var(--muted);padding:32px 0}
.th{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 8px}
.th .dot{width:22px;height:22px}
.sw{display:none}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;touch-action:manipulation}
.dot.on{border-color:var(--fg)}
.dot:disabled{opacity:.25}
.eb{height:8px;width:100%;background:var(--edge);border-radius:4px;overflow:hidden;order:1;margin:8px 0 0}
.eb i{display:block;height:100%;width:100%;background:#3B82F6;border-radius:4px}
.eb.on i{background:#60A5FA}
.eb.lock i{background:#94A3B8}
.eb[data-p="1"]{display:none}
.pad .sp{color:#3B82F6;border-color:#3B82F6;-webkit-touch-callout:none}
.pad .sp.on{background:#3B82F6;color:#fff}
.stage{position:relative}
.cmp{position:absolute;top:6px;width:52px;aspect-ratio:1;border-radius:50%;border:1px solid var(--edge);background:var(--btn);opacity:.9;z-index:2;pointer-events:none}
.cmp[data-p="0"]{left:6px}
.cmp[data-p="1"]{display:none;right:6px}
.cmp::before,.cmp::after{content:'';position:absolute;left:50%;top:50%;background:var(--edge);transform:translate(-50%,-50%)}
.cmp::before{width:1px;height:70%}
.cmp::after{width:70%;height:1px}

.hint{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,86vw);background:var(--btn);color:var(--fg);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.6;z-index:10}

body.im main{position:relative;max-width:none;padding:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
body.im{touch-action:none;overflow:hidden} /* 沉浸布局锁死视口滚动：消滚动条与按键/触控板晃动 */

body.im .mode{position:absolute;top:4px;left:50%;transform:translateX(-50%);margin:0;z-index:2;flex-wrap:wrap;justify-content:center;gap:4px 6px;max-width:calc(100vw - 16px);white-space:nowrap}
body.im .mode button{font-size:12px;padding:3px 9px}
body.im .mode select{font-size:12px;padding:3px 8px}
body.im .pad{position:absolute;bottom:8px;width:132px;margin:0;gap:6px;z-index:2}
body.im .pad[data-p="0"]{left:10px}
body.im .pad[data-p="1"]{display:grid;right:10px}
body.im .pad button{font-size:20px;padding:10px 0;opacity:.85}
body.im .sw{display:grid;grid-template-columns:repeat(3,24px);gap:4px;position:absolute;top:84px;z-index:2}
body.im .dot{width:24px;height:24px}
body.im .cmp{top:34px;width:44px} /* 顶部 4–30px 是工具栏带，罗盘下移避让 */
body.im .cmp[data-p="0"]{left:10px}
body.im .cmp[data-p="1"]{display:block;right:10px}
body.im .eb{position:absolute;top:48px;width:76px;margin:0;z-index:2}
body.im .eb[data-p="0"]{left:62px}
body.im .eb[data-p="1"]{display:block;right:62px}
body.ai .pad[data-p="1"],body.ai .cmp[data-p="1"]{display:none}
body.im .sw[data-p="0"]{left:10px}
body.im .sw[data-p="1"]{right:10px}
body.im .th{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:nowrap;gap:6px;margin:0;z-index:2} /* 沉浸：主题点统一居中悬在工具栏正下方（窄屏见下方媒体查询移到底部） */
body.im .th .dot{width:20px;height:20px}
body.im:not(.pk) .pad[data-p="0"]{left:auto;right:10px} /* 单人沉浸：pad 右下 */
body.im:not(.pk) .eb[data-p="0"]{left:auto;right:10px;top:40px} /* 单人沉浸：能量条右上（主题点已移居工具栏下方，不再让位） */
body.im:not(.pk) .sw[data-p="1"],body.im:not(.pk) .cmp[data-p="1"],body.im:not(.pk) .eb[data-p="1"],body.im:not(.pk) .pad[data-p="1"]{display:none} /* 单人沉浸隐藏 P2 专属 UI */
body.im #toast{bottom:44px} /* 沉浸：toast 抬到底部 HUD 之上 */
@media (max-width:899px){body.im .th{top:auto;bottom:36px}body.im #toast{bottom:70px}} /* 窄屏沉浸：工具栏可能换行，主题点移到底部居中（HUD 之上），toast 再抬一级 */
@media (orientation:portrait){body.pk:not(.im){overflow:auto}body.pk:not(.im) main{height:auto;display:block;padding:16px}body.pk:not(.im) .hud,body.pk:not(.im) .mode{position:static;transform:none;margin:0 0 8px}body.pk:not(.im) .mode button{font-size:14px;padding:6px 16px}body.pk:not(.im) .stage{display:none}body.pk:not(.im) .rotate{display:block}}

/* 远征小地图：HUD 一侧独立小 canvas，只在 ?mode=expedition 显示，4~8Hz 重绘（规格 §4） */
#mm{position:fixed;left:10px;bottom:10px;width:96px;height:96px;z-index:40;display:none;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(6,10,20,.55);pointer-events:none;opacity:.9}
body.mm #mm{display:block}
</style>

<body>
<main>
<h1>等距贪吃蛇</h1>
<div class="mode">

<select id="spr" aria-label="冲刺音效" title="冲刺音效">

</select>
</div>

      <canvas id="mm" width="96" height="96" aria-hidden="true"></canvas>
<div class="stage">
<div class="pad" data-p="0">
<button class="sp" aria-label="冲刺">冲</button><button data-s="up" aria-label="上">↑</button><span></span>
<button data-s="left" aria-label="左">←</button><button data-s="down" aria-label="下">↓</button><button data-s="right" aria-label="右">→</button>
</div>
<canvas id="c" role="img" aria-label="等距视角的贪吃蛇棋盘"></canvas>
<div class="eb" data-p="0"><i></i></div>
<div class="eb" data-p="1"><i></i></div>

<button class="sp" aria-label="冲刺">冲</button><button data-s="up" aria-label="上">↑</button><span></span>

<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<p class="tip">方向键对应屏幕方向，空格暂停。按住 Shift、E 或 Enter 冲刺，手机按住「冲」键冲刺，也可在棋盘上滑动转向。罗盘里箭头是蛇的朝向，橙点指向最近的食物。简单模式有 3 条命。</p>
</main>
<script>
/* core.js —— 游戏规则与状态（唯一真相）
   约束：不碰 DOM / CSS / 音频 / 粒子 / 绘制；对表现层只通过 bus 事件与只读状态 S 通信。 */
window.Snake = window.Snake || {};
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  const K = {
    TW: 30, TH: 15,
    HW: 15, HH: 7.5,                     // 半格宽/高：TW/TH 派生常量（去 getter，省逐帧热路径开销）
    OY: 34,
    MODES: {
      easy:   { n: 12, start: 220, min: 120, accel: 3, lives: 3, players: 1, foods: 1 },
      normal: { n: 12, start: 150, min: 70,  accel: 4, lives: 1, players: 1, foods: 1 },
      pk:     { n: 18, start: 160, min: 100, accel: 2, lives: 1, players: 2, foods: 3 },
      ai:     { n: 18, start: 160, min: 100, accel: 2, lives: 1, players: 2, foods: 3, ai: true },
      /* 3.0 远征：地图尺寸与出生点来自关卡数据（levels.js），视口格数另算（桌面 18 / 窄屏 14） */
      expedition: { n: 24, start: 170, min: 90, accel: 3, lives: 1, players: 1, foods: 1 }
    },
    /* 皮肤：玩家身份标识，不随主题变化 */
    SK: [
      { name: '青绿', body: ['#5DCAA5', '#1D9E75', '#0F6E56'], head: ['#E1F5EE', '#5DCAA5', '#1D9E75'] },
      { name: '天蓝', body: ['#85B7EB', '#378ADD', '#185FA5'], head: ['#E6F1FB', '#85B7EB', '#378ADD'] },
      { name: '紫', body: ['#AFA9EC', '#7F77DD', '#534AB7'], head: ['#EEEDFE', '#AFA9EC', '#7F77DD'] },
      { name: '琥珀', body: ['#FAC775', '#EF9F27', '#BA7517'], head: ['#FAEEDA', '#FAC775', '#EF9F27'] },
      { name: '粉', body: ['#F4C0D1', '#D4537E', '#993556'], head: ['#FBEAF0', '#ED93B1', '#D4537E'] },
      { name: '灰', body: ['#D3D1C7', '#888780', '#5F5E5A'], head: ['#F1EFE8', '#B4B2A9', '#888780'] }
    ],
    SPRINT_HEAD: ['#DCEBFF', '#7DB8FF', '#3B82F6'],   // 冲刺时蛇头配色（固定）
    DEAD: ['#F7C1C1', '#E24B4A', '#A32D2D'],
    FOOD: ['#F0997B', '#D85A30', '#993C1D'],
    FOOD_PK: ['#FFFFFF', '#CBD5E1', '#94A3B8'],
    /* 格坐标方向（等距屏上视角） */
    DIRS: { upRight: [0, -1], downRight: [1, 0], downLeft: [0, 1], upLeft: [-1, 0] },
    /* 方向键 → 格方向：**一键一方向**（4 个键各自控制一个方向，按下必转，不再「一键两个候选」）。
       等距屏上顺时针一圈：↑ = 右上、→ = 右下、↓ = 左下、← = 左上。
       turn() 会拒绝「与当前/排队方向相同」与「反向掉头」，所以按到自己正在走的方向＝不动、按反向＝不动。 */
    SCREEN: {
      up:    [0, -1],   // 右上
      right: [1, 0],    // 右下
      down:  [0, 1],    // 左下
      left:  [-1, 0]    // 左上
    },
    /* 集中调参表：散在各模块的魔法数收拢于此（平衡性迭代 / 文档 / 测试共用） */
    TUNE: {
      lowFxOn: .032, lowFxOff: .020, lowFxRecover: 120,  // render 帧耗时 EMA：超过 on 降级，低于 off 连续 recover 帧恢复
      comboWindow: 6000, comboBonus: 1,                  // 连击：6s 内持续吃食，第 2 个起每个额外 +1（×2 封顶）
      goldChance: .12, goldTtl: 6000, goldScore: 3, goldEnergy: 30,  // 金苹果：每次吃食后 12% 概率出现，6s 过期，+3 分 +30 能量
      foods3d: 6,   // 3D 双人对战的食物数：层图地图大、可走格多，多给几颗，别让两条蛇死抢同一颗（经典模式仍用 MODES.foods）
      moveLead: 8                                        // 插值起势：移动那一帧把插值时钟提前 8ms（≈半帧），按下后首帧就看得见位移
    }
  };

  /* ---------- 状态（唯一真相，其他模块只读；写入仅经 api） ---------- */
  const S = {
    N: 12, W: 380, H: 240, OX: 190,
    MAP_N: 12, VIEW_N: 12,              // 3.0：地图边长与视口格数分离（经典模式两者相等，行为不变）
    T: null, levelId: '', levelName: '', camCX: 0, camCY: 0,   // 远征：层图 / 关卡 / 相机中心（渲染层只读）
    lowFx: false, frameDt: .016,        // lowFx 由 render 检测并写入
    mode: 'easy', pl: [], foods: [], state: 'ready', msg: '', last: 0,
    best: 0, wins: [0, 0], winner: -1, tickN: 0, overAt: 0, skin: [0, 1], fxGood: 0,
    seed: 0, daily: false,              // 每日挑战：随机种子（0=未播种），daily 标记决定徽章/成绩文案
    gold: null,                         // 金苹果 {x, y, born}，born 以游戏时钟计
    rec: [], myMoves: 0,                // 幽灵录制：p0 每步头格 [x,y,x,y,…] 与已走步数
    ghost: null, ghostMeta: null, ghostOn: false,   // 幽灵回放：破纪录时存档，newGame 时加载
    stats: { games: 0, food: 0, gold: 0 }, resultText: ''   // 本地累计统计 + 结算分享文案
  };

  /* ---------- 事件总线 ---------- */
  const bus = (() => {
    const m = {};
    return {
      on(ev, fn) { (m[ev] = m[ev] || []).push(fn); },
      off(ev, fn) { if (m[ev]) m[ev] = m[ev].filter(f => f !== fn); },
      emit(ev, d) { (m[ev] || []).forEach(f => { try { f(d); } catch (e) { console.error('[bus]', ev, e); } }); }
    };
  })();

  /* ---------- 纯函数工具 ---------- */
  /* mulberry32 种子随机：每日挑战启用。只有"逻辑随机"（食物/金苹果落点）走这里；
     粒子、闪电等视觉随机仍用 Math.random，不消耗种子流，保证同种子同操作 → 同一局 */
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let seedFn = null;
  const rand = n => Math.floor((seedFn ? seedFn() : Math.random()) * n);
  function setSeed(s) { seedFn = s ? mulberry32(s) : null; S.seed = s || 0; }
  const dateSeed = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  const dateStr = s => (s >= 19000101 && s <= 99991231) ? ((s / 10000) | 0) + '-' + String(((s / 100) % 100) | 0).padStart(2, '0') + '-' + String(s % 100).padStart(2, '0') : '';   // 仅日期形种子可转日期
  const safeGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const nm = i => (K.MODES[S.mode].ai ? (i ? 'AI' : '你') : 'P' + (i + 1));
  /* 等距投影：格 (x,y) 顶点的屏幕坐标 */
  const P = (x, y) => [S.OX + (x - y) * K.HW, K.OY + (x + y) * K.HH];
  /* 廉价种子随机（闪电用） */
  const fr = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
  /* hex → rgba 字符串 */
  const rgba = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
  /* 由主色派生立方体 [亮, 中, 暗] 三面（食物/发光体用） */
  const shades = (hex, up = .35, down = .45) => {
    const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    const hx = n => '#' + n.map(v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('');
    return [hx(c.map(v => v + (255 - v) * up)), hex, hx(c.map(v => v * (1 - down)))];
  };

  /* ---------- 游戏逻辑 ---------- */
  /* 地图边长与视口格数分开：经典模式两者相等（三道视觉/行为锁依赖），远征模式视口按屏幕取 18/14 */
  function setSize(mapN, viewN) {
    S.N = S.MAP_N = mapN; S.VIEW_N = viewN;
    S.W = viewN * K.TW + 20; S.H = viewN * K.TH + K.OY + 12; S.OX = S.W / 2;
    bus.emit('resize', { n: viewN });    // render 监听并同步 canvas 尺寸
  }
  /* 视口格数：单人跟相机（手机 14 / 桌面 18）；双人模式地形下走「全景固定」⇒ 直接用整张地图宽度
     （规格 §4：PK 保持全景固定视角，不用跟随相机 ⇒ 用能整张放下的小图 test-24） */
  const viewN = () => {
    if (S.terrain && S.T && K.MODES[S.mode].players === 2) return S.T.w;
    return (typeof matchMedia === 'function' && matchMedia('(max-width: 640px)').matches) ? 14 : 18;
  };
  /* 3D（地形）开关：与模式正交 —— ?terrain=1 开、?terrain=<关卡 id> 开并选图、?level=<id> 隐含开启；
     ?mode=expedition 是「普通规则 + 地形」的预设（等价于 terrain=1），旧直链继续可用。 */
  const tsOn = () => S.mode === 'expedition' || !!S.terrain;
  /* 关卡：层图由 terrain.js 建好后挂在 S.T 上；3D 关闭时 S.T 为 null ⇒ 走经典棋盘 */
  function loadLevel(id) {
    const lv = Snake.levelById(id) || Snake.LEVELS[0];
    S.T = Snake.Terrain.build(lv); S.levelId = lv.id; S.levelName = lv.name;
  }
  /* 是否阻挡：有层图按层图（Stage 1 只看最高可走层 ⇒ 墙/水挡、高台与桥面可走），否则按棋盘边界 */
  const solid = (x, y) => S.T ? !S.T.hasWalk(x, y) : (x < 0 || y < 0 || x >= S.N || y >= S.N);
  /* 站在传送门层上时的出口（规格 §3.4）：传送门是层图上的双向边，踩上去下一步送到对端，路径允许不连续 */
  function portalEdge(x, y, L) {
    const l = S.T && S.T.layerAt(x, y, L);
    if (!l || l.kind !== 'portal' || !l.portal) return null;
    const pe = S.T.portalTo(x, y, l.portal);
    return pe ? { x: pe.x, y: pe.y, L: pe.L } : null;
  }
  /* 相机：跟随 p0 头部——死区 2 格定出目标，再按指数平滑追上去（不跳格才丝滑）；经典模式固定在地图中心 */
  function camFollow() {
    if (!S.T) { S.camCX = (S.N - 1) / 2; S.camCY = (S.N - 1) / 2; return; }
    const h = S.pl[0] && S.pl[0].body[0]; if (!h) return;
    const half = (S.VIEW_N - 1) / 2, dz = 2;
    const tx = Math.abs(h.x - S.camCX) > dz ? h.x - Math.sign(h.x - S.camCX) * dz : S.camCX;
    const ty = Math.abs(h.y - S.camCY) > dz ? h.y - Math.sign(h.y - S.camCY) * dz : S.camCY;
    const jump = S.pl[0].body[1] && Math.abs(S.pl[0].body[1].x - h.x) + Math.abs(S.pl[0].body[1].y - h.y) > 3;   // 传送门：一帧跨好几格
    const snap = (Snake.hooks && Snake.hooks.noCamSmooth) || jump;           // 系统「减弱动态」或传送：直接贴到目标，不做缓动（否则像画面被拽走）
    const dt = S.frameDt > 0 ? S.frameDt : 1 / 60;
    const k = snap ? 1 : 1 - Math.pow(.0009, dt);                            // 时间常数 ~0.14s，与帧率无关
    S.camCX += (tx - S.camCX) * k; S.camCY += (ty - S.camCY) * k;
    S.camCX = Math.max(half, Math.min(S.N - 1 - half, S.camCX));
    S.camCY = Math.max(half, Math.min(S.N - 1 - half, S.camCY));
  }
  /* 经典模式沿用 2.0 的榜/存档键（不动老数据）；开了 3D 按规格 §3.7 用 iso-snake-3: 前缀，
     并把模式与关卡 id 都写进键里（同一关卡在不同模式下的成绩分开记） */
  const bestKey = () => S.T ? 'iso-snake-3:best-' + S.mode + '-' + S.levelId : 'iso-snake-best2-' + S.mode;
  const ghostKey = () => S.T ? 'iso-snake-3:ghost-' + S.mode + '-' + S.levelId : 'iso-snake-ghost-' + S.mode;
  function loadBest() { S.best = +safeGet(bestKey(), 0) || 0; }
  /* 本地统计（累计局数/食物/金苹果），持久化于 iso-snake-stats */
  function loadStats() { try { const o = JSON.parse(safeGet('iso-snake-stats', '{}')); S.stats = { games: +o.games || 0, food: +o.food || 0, gold: +o.gold || 0 }; } catch (e) {} }
  function persistStats() { safeSet('iso-snake-stats', JSON.stringify(S.stats)); }
  /* 幽灵回放：破纪录时把整条路径存档；newGame 时加载当前模式的存档 */
  function loadGhost() {
    try {
      const g = JSON.parse(safeGet(ghostKey(), 'null'));
      S.ghost = g && Array.isArray(g.path) && g.path.length >= 4 ? g.path : null;
      S.ghostMeta = S.ghost ? { score: g.score | 0, date: g.ts ? new Date(g.ts).toLocaleDateString() : '' } : null;
    } catch (e) { S.ghost = null; S.ghostMeta = null; }
  }
  function saveGhost(p) { if (S.rec.length >= 4) safeSet(ghostKey(), JSON.stringify({ score: p.score, ts: Date.now(), path: S.rec })); }
  /* 结算分享文案（复制成绩按钮用） */
  const MODE_NAME = { easy: '简单', normal: '普通', pk: '双人对战', ai: '人机对战', expedition: '远征' };
  const URL_HOME = 'https://kkkk16689.github.io/isometric-snake/';
  function buildResultText() {
    if (K.MODES[S.mode].players === 1) {
      const p = S.pl[0], ds = dateStr(S.seed);
      return S.daily
        ? '等距贪吃蛇 2.0 · 每日挑战' + (ds ? ' ' + ds : '') + '（种子 ' + S.seed + '）：得分 ' + p.score + '，长度 ' + p.body.length + '。来战：' + URL_HOME + '?daily=1'
        : '等距贪吃蛇 2.0 · ' + MODE_NAME[S.mode] + '：得分 ' + p.score + '，长度 ' + p.body.length + '。来战：' + URL_HOME;
    }
    return '等距贪吃蛇 2.0 · ' + MODE_NAME[S.mode] + '：' + (S.winner >= 0 ? nm(S.winner) + ' 胜' : '平局') + '（' + S.pl.map(p => p.score).join(' : ') + '）。来战：' + URL_HOME;
  }
  function spawn(i, p) {
    const two = K.MODES[S.mode].players === 2;
    let dir;
    if (S.T) {   // 远征：出生点与朝向来自关卡数据，蛇身沿反方向铺 3 格（关卡校验保证前方有 3 格跑道）
      const s = S.T.spawns[Math.min(i, S.T.spawns.length - 1)];
      dir = K.DIRS[s.dir] || K.DIRS.downRight;
      p.body = [0, 1, 2].map(k => {   // 每节带层高 L（规格 §3.2：碰撞/吃食/占位只比同 (x,y,L)）
        const bx = s.x - dir[0] * k, by = s.y - dir[1] * k;
        const tw = S.T.topWalk(bx, by);
        return { x: bx, y: by, L: tw ? tw.h : 0 };
      });
    } else {     // 经典：出生点与朝向保持 2.0 原样（行为锁/视觉锁依赖它）；L 恒 0
      const y = two ? (i ? S.N - 5 : 4) : 6, xs = two ? (i ? [S.N - 5, S.N - 4, S.N - 3] : [4, 3, 2]) : [3, 2, 1];
      p.body = xs.map(x => ({ x, y, L: 0 })); dir = i ? K.DIRS.upLeft : K.DIRS.downRight;
    }
    p.dir = dir; p.queue = []; p.dead = false;
    p.moveT = 0; p.moveTGame = 0; p.moveP = 300; p.grew = false; p.tailFrom = null; p.streakAt = 0;  // 插值/连击时钟复位
  }
  /* 可放格列表（食物/金苹果共用）
     远征：每格取「最高可走层」（规格 §3.5：桥下地面不生成，避免看不见却吃得到），并只保留从 p0 头所在层
     可达的节点——层图 BFS 一次算完；经典：x*1024+y 原语义，L 恒 0（行为锁依赖原语义）。 */
  function freeCells() {
    const taken = new Set();
    const tk = s => S.T ? S.T.key(s.x, s.y, s.L || 0) : (s.x * 1024 + s.y);
    S.pl.forEach(p => p.body.forEach(s => taken.add(tk(s))));
    S.foods.forEach(f => taken.add(tk(f)));
    if (S.gold) taken.add(tk(S.gold));   // 金苹果占位：补充食物不得与其重叠
    let reach = null;
    if (S.T) {
      const h = S.pl[0] && S.pl[0].body[0];
      reach = h ? S.T.reachable(h.x, h.y, h.L || 0) : null;   // §3.5：不可达的层不生成
    }
    const free = [];
    for (let y = 0; y < S.N; y++) for (let x = 0; x < S.N; x++) {
      if (S.T) {
        const tw = S.T.topWalk(x, y); if (!tw) continue;
        const k = S.T.key(x, y, tw.h);
        if (reach && !reach.has(k)) continue;
        if (!taken.has(k)) free.push({ x, y, L: tw.h });
      } else if (!taken.has(x * 1024 + y)) free.push({ x, y, L: 0 });
    }
    return free;
  }
  function fillFoods() { // 空格列表取样（拒绝采样在长局会退化，满盘时无解）；无处可放 → 满盘结算
    const want = (S.T && K.MODES[S.mode].players === 2) ? K.TUNE.foods3d : K.MODES[S.mode].foods;   // 3D 双人对战多给食物，减少「抢同一颗」的迎头撞
    if (S.foods.length >= want) return;
    const free = freeCells();
    while (S.foods.length < want) {
      if (!free.length) { boardFull(); return; }
      const k = rand(free.length);
      S.foods.push(free[k]); free.splice(k, 1);
    }
  }
  function spawnGold(now) {   // 金苹果落在任意空格（与蛇身/普通食物互斥）
    const free = freeCells();
    if (!free.length) return;
    const c = free[rand(free.length)];
    S.gold = { x: c.x, y: c.y, L: c.L, born: now };
    bus.emit('goldSpawn', { x: c.x, y: c.y, L: c.L });
  }
  function boardFull() { // 棋盘被蛇填满：单人视为获胜，双人判平局
    S.state = 'over'; S.overAt = performance.now();
    S.stats.games++; persistStats();
    if (K.MODES[S.mode].players === 1) {
      const p = S.pl[0]; S.msg = '棋盘填满 · ' + p.score + ' 分';
      if (p.score > S.best) { S.best = p.score; safeSet(bestKey(), S.best); saveGhost(p); }
      bus.emit('win', { winner: 0, full: true });
    } else {
      S.winner = -1; S.msg = '棋盘填满 · 平局';
      bus.emit('win', { winner: -1, full: true });
    }
    S.resultText = buildResultText();
    bus.emit('hud');
  }
  function newGame() {
    const m = K.MODES[S.mode];
    if (tsOn()) { if (!S.T) loadLevel(S.levelId || 'test-24'); setSize(S.T.w, viewN()); }   // 3D：按关卡建层图，视口按模式定
    else { S.T = null; setSize(m.n, m.n); }   // 未开 3D：清掉层图、视口=棋盘（2.0 行为与视觉都不变）
    if (S.daily && S.seed) setSeed(S.seed);   // 每日挑战重开：随机流复位到同一种子（同种子同局）
    S.tickN = 0; S.lowFx = false; S.frameDt = .016; S.fxGood = 0;
    S.pl = [...Array(m.players)].map((_, i) => {
      const p = { score: 0, lives: m.lives, energy: 100, locked: false, hold: false, sprint: false, trail: [], streak: 0, ai: !!m.ai && i === 1,
                  moveT: 0, moveP: 300, grew: false, tailFrom: null, streakAt: 0 };  // moveT/moveP：渲染插值时钟；grew/tailFrom：尾格来源
      spawn(i, p); return p;
    });
    S.gold = null; S.rec = []; S.myMoves = 0;   // 内容态复位须在 fillFoods 前：金苹果占位参与空格取样，否则重开随机流与全新实例错位
    S.foods = []; fillFoods(); S.state = 'ready'; S.msg = ''; S.winner = -1;
    loadGhost();   // 幽灵存档随新一局重载
    camFollow();   // 相机起点（经典＝地图中心 ⇒ 渲染偏移恒 0）
    bus.emit('hud'); bus.emit('gameStart');
  }
  function turn(p, d) {
    const ref = p.queue.length ? p.queue[p.queue.length - 1] : p.dir;
    if (d[0] === ref[0] && d[1] === ref[1]) return;
    if (d[0] + ref[0] === 0 && d[1] + ref[1] === 0) return;
    if (p.queue.length < 2) p.queue.push(d);
  }
  function steer(p, name) {           // 一键一方向：直接交给 turn()（它负责忽略「同向」与「反向」）
    const d = K.SCREEN[name];
    if (d) turn(p, d);
  }
  function step(now) {   // now = 游戏时钟（S.last），与 rAF 的 t 同基准，供插值/连击
    S.tickN++;
    S.pl.forEach(p => { if (p.streak > 0 && now - p.streakAt > K.TUNE.comboWindow) p.streak = 0; });   // 连击超时衰减
    if (S.gold && now - S.gold.born > K.TUNE.goldTtl) S.gold = null;   // 金苹果过期（游戏时钟，暂停不计时）
    S.pl.forEach((p, i) => { if (p.ai && !p.dead && Snake.hooks.think) Snake.hooks.think(p, i); });
    const dt = tickMs() / 1000;
    S.pl.forEach((p, i) => {   // 冲刺耗能 / 恢复；能量归零锁定到 30
      const was = p.sprint;
      const want = p.hold && p.energy > 0 && !p.locked;
      if (want && !p.sprint) bus.emit('sprintOn', { i });
      p.sprint = want;
      if (want) { p.energy = Math.max(0, p.energy - 45 * dt); if (p.energy === 0) { p.locked = true; p.sprint = false; bus.emit('sprintLock', { i }); } }
      else { p.energy = Math.min(100, p.energy + 18 * dt); if (p.locked && p.energy >= 30) p.locked = false; }
      if (!p.sprint && was) bus.emit('sprintOff', { i });
    });
    const mv = S.pl.map(p => p.sprint || S.tickN % 2 === 0); // 冲刺每 tick 动，平时隔 tick
    const hs = S.pl.map((p, i) => {
      if (!mv[i]) return null;
      if (p.queue.length) p.dir = p.queue.shift();
      const h0 = p.body[0], L0 = h0.L || 0;
      if (!S.T) return { x: h0.x + p.dir[0], y: h0.y + p.dir[1], L: 0, bad: solid(h0.x + p.dir[0], h0.y + p.dir[1]) };
      const pe = p.portCool ? null : portalEdge(h0.x, h0.y, L0);   // §3.4：踩在传送门上 → 本步走传送门边
      if (pe) { p.portCool = true; bus.emit('port', { x: h0.x, y: h0.y, L: L0, tx: pe.x, ty: pe.y, tL: pe.L || 0, i }); return pe; }   // 两端都要有光效，别让人「莫名其妙被传走」
      p.portCool = false;                                         // 刚从传送门出来那一拍不许再传：否则会在两端来回弹、身体叠在自己头上把自己撞死（用户反馈「一到传送门就死」）
      const nx = h0.x + p.dir[0], ny = h0.y + p.dir[1], pk = S.T.pick(nx, ny, L0);   // §3.3：按层选落点
      if (!pk) return { x: nx, y: ny, L: L0, bad: true };          // 墙 / 水 / 悬崖（最小高差 > 1）
      if (pk.layer && pk.layer.kind === 'ice') {                    // 冰面：一步可能滑多格（§5 的 transition 表）
        if (p.ai) return { x: nx, y: ny, L: L0, bad: true };         // §5 门控：AI 会用滑行表之前一律不踩冰
        const slideFn = S.T.slide || (Snake.Terrain && Snake.Terrain.slide);   // 滑行表是 terrain 的模块级导出（不在层图对象上）
        const sl = slideFn(S.T, h0.x, h0.y, L0, [p.dir[0], p.dir[1]], 64);
        const last = sl.path[sl.path.length - 1];
        if (last) return { x: last.x, y: last.y, L: last.L, bad: false, slide: sl.path };
      }
      return { x: nx, y: ny, L: pk.h };
    });
    const onFood = (x, y, L) => S.foods.findIndex(f => f.x === x && f.y === y && (f.L || 0) === (L || 0));
    const eat = hs.map(h => {                        // 冰面滑行：途经格上的食物也算吃掉（§5 逐格处理）
      if (!h) return -1;
      if (h.slide) for (const s of h.slide) { const k = onFood(s.x, s.y, s.L); if (k >= 0) return k; }
      return onFood(h.x, h.y, h.L);
    });
    const hit = hs.map((h, i) => {
      if (!h) return false;
      if (h.bad) return true;                                      // 撞墙/水/悬崖
      const L = h.L || 0;
      if (hs.some((o, j) => j !== i && o && !o.bad && o.x === h.x && o.y === h.y && (o.L || 0) === L)) return true;  // 对头相撞（同层才算）
      return S.pl.some((q, j) => (mv[j] && eat[j] < 0 ? q.body.slice(0, -1) : q.body).some(s => s.x === h.x && s.y === h.y && (s.L || 0) === L));
    });
    if (K.MODES[S.mode].players === 1) {
      const p = S.pl[0];
      if (hit[0]) {
        p.lives--; p.streak = 0;
        if (p.lives > 0) { bus.emit('crash', { heads: [hs[0]], partial: true }); spawn(0, p); S.state = 'paused'; S.msg = '撞到了！还剩 ' + p.lives + ' 条命'; bus.emit('hud'); }
        else gameOver();
        return;
      }
    } else if (hit.some(Boolean)) { hit.forEach((h, i) => S.pl[i].dead = h); gameOver(); return; }
    S.pl.forEach((p, i) => {
      if (!hs[i]) return;
      if (p.sprint) { p.trail.push({ x: p.body[0].x, y: p.body[0].y, L: p.body[0].L || 0, b: performance.now() }); if (p.trail.length > 14) p.trail.shift(); }
      p.body.unshift(hs[i]);
      if (eat[i] >= 0) {
        if (now - p.streakAt > K.TUNE.comboWindow) p.streak = 0;
        p.streak++; p.streakAt = now;
        const gain = 1 + (p.streak >= 2 ? K.TUNE.comboBonus : 0);   // 连击中每个食物 +2（×2 封顶）
        p.score += gain; if (!p.ai) S.stats.food++;   // 统计只记人类玩家（ai 模式对手蛇不计入）
        bus.emit('eat', { x: S.foods[eat[i]].x, y: S.foods[eat[i]].y, pk: K.MODES[S.mode].players === 2, streak: p.streak, pts: gain, i });
      }
      else p.tailFrom = p.body.pop();
      p.grew = eat[i] >= 0; p.moveT = S.now > 0 ? S.now - K.TUNE.moveLead : now; p.moveTGame = now; p.moveP = p.sprint ? tickMs() : tickMs() * 2;   // 冲刺每 tick 动，平时隔 tick；moveT 用渲染时钟并提前 moveLead 起势，moveTGame 留作 ?interp=legacy 对比
      if (i === 0) { S.rec.push(hs[i].x, hs[i].y); S.myMoves++; }   // 幽灵录制：p0 每步头格
    });
    if (S.gold) {   // 金苹果拾取：+3 分 +30 能量，不增长、不影响连击（两蛇同 tick 踩上则先手判给 p0）
      const gi = hs.findIndex(h => h && !h.bad && h.x === S.gold.x && h.y === S.gold.y && (h.L || 0) === (S.gold.L || 0));
      if (gi >= 0) {
        const p = S.pl[gi];
        p.score += K.TUNE.goldScore; if (!p.ai) S.stats.gold++;
        p.energy = Math.min(100, p.energy + K.TUNE.goldEnergy);
        if (p.locked && p.energy >= 30) p.locked = false;
        bus.emit('eat', { x: S.gold.x, y: S.gold.y, pk: K.MODES[S.mode].players === 2, gold: true, pts: K.TUNE.goldScore, streak: p.streak, i: gi });
        S.gold = null;
      }
    }
    const eaten = new Set(eat.filter(k => k >= 0));
    S.foods = S.foods.filter((_, k) => !eaten.has(k)); fillFoods();
    if (eaten.size && !S.gold && rand(1000) < K.TUNE.goldChance * 1000) spawnGold(now);   // 每次真正吃到食物后掷金苹果
    bus.emit('hud');
  }
  function gameOver() {
    S.state = 'over'; S.overAt = performance.now();
    S.stats.games++; persistStats();
    if (K.MODES[S.mode].players === 1) {
      const p = S.pl[0]; p.dead = true;
      if (p.score > S.best) { S.best = p.score; safeSet(bestKey(), S.best); saveGhost(p); }   // 破纪录：最高分 + 幽灵存档一起刷新
      bus.emit('lose', { i: 0 });
    } else {
      const alive = S.pl.map((p, i) => p.dead ? -1 : i).filter(i => i >= 0);
      S.winner = alive.length === 1 ? alive[0] : -1;
      if (S.winner >= 0) S.wins[S.winner]++;
      bus.emit('win', { winner: S.winner });
    }
    S.resultText = buildResultText();
    const heads = S.pl.filter(p => p.dead).map(p => ({ x: p.body[0].x, y: p.body[0].y }));
    bus.emit('crash', { heads });
    bus.emit('hud');
  }
  const interval = () => { const m = K.MODES[S.mode]; return Math.max(m.min, m.start - S.pl.reduce((a, p) => a + p.score, 0) * m.accel); };
  const tickMs = () => interval() / 2; // 一次普通移动 = 两个 tick（冲刺可每 tick 移动）

  /* ---------- 状态机 api ---------- */
  function start() { if (S.state === 'over') { if (performance.now() - S.overAt < 1200) return; newGame(); } S.state = 'playing'; S.msg = ''; S.last = performance.now(); } // 结算界面 1.2s 锁，防连点跳过
  function togglePause() { if (S.state === 'playing') { S.state = 'paused'; S.msg = ''; } else start(); }
  function press(i, name) { if (S.state !== 'playing') { start(); if (S.state !== 'playing') return; } if (S.pl[i]) steer(S.pl[i], name); }
  const setHold = (i, v) => { if (S.pl[i]) S.pl[i].hold = v; };
  function setMode(m) {
    S.mode = m; S.wins = [0, 0]; S.daily = false; setSeed(0);
    if (tsOn()) loadLevel(S.levelId || 'test-24'); else S.T = null;   // 开了 3D 就建层图，回经典就清掉
    loadBest(); newGame(); bus.emit('hud');
  }
  function setSkin(p, k) { S.skin[p] = k; bus.emit('hud'); }
  /* 每日挑战：固定普通模式 + 当日/自定义种子，食物序列可复现 */
  function startDaily(seed) {
    S.mode = 'normal'; S.wins = [0, 0]; S.daily = true;
    setSeed(seed || dateSeed());
    loadBest(); newGame(); bus.emit('hud');
  }
  function setGhostOn(v) { S.ghostOn = !!v; safeSet('iso-snake-ghost-on', S.ghostOn ? '1' : '0'); }
  /* render 每帧调用：追赶式 tick（帧率无关）。掉帧后最多补 1 步，其余积压直接丢弃——
     补跑多步会让蛇在一帧里连跳好几格（用户明确要求「不卡、没有瞬移」），宁可让节奏短暂放慢。 */
  function update(t) {
    S.now = t;   // 渲染时钟：插值起点改用实测帧时间（S.last 是游戏时钟，可能落后最多一个 tick ⇒ 每格起点最多偏半格，看着一顿一顿）
    if (S.state === 'playing') {
      let n = 0;
      while (S.state === 'playing' && t - S.last >= tickMs() && n++ < 1) { S.last += tickMs(); step(S.last); }
      if (t - S.last > tickMs()) S.last = t;   // 还有积压（大卡顿 / 切后台回来）：对齐当前时刻，不补跑
    }
    camFollow();   // 相机跟随（纯数学、无 DOM；渲染层逐帧只读 S.camCX/camCY）
  }

  const qs = new URLSearchParams(location.search);   // 便于截图/直链分享（?theme= ?mode= ?daily=1 ?seed=N），mode 仅初始值
  if (qs.get('mode') && K.MODES[qs.get('mode')]) S.mode = qs.get('mode');
  if (qs.get('daily') || qs.get('seed')) {   // ?daily=1 今日种子；?seed=N 自定义种子（均按每日挑战处理，固定普通模式）
    S.mode = 'normal'; S.daily = true;
    setSeed((+qs.get('seed') | 0) || dateSeed());
  }
  S.terrain = false;   // 3D（地形）开关，默认关：只有 URL 明确要求时才开，经典直链行为不变
  const tv = qs.get('terrain');
  if (tv !== null && tv !== '0') { S.terrain = true; if (tv !== '1') S.levelId = tv; }   // ?terrain=1 / ?terrain=harbor-32
  if (qs.get('level')) { S.levelId = qs.get('level'); S.terrain = true; }                 // ?level=<id> 隐含开启
  if (S.mode === 'expedition') S.terrain = true;                                          // 远征＝普通规则 + 地形的预设
  // ?mode=ai&terrain=1&level=test-24 直达：这里只记模式/开关/关卡 id，层图留到 newGame 再建
  // （core.js 是最先执行的脚本，此刻 levels.js / terrain.js 还没加载，不能在这里调 loadLevel）
  loadStats();
  S.ghostOn = safeGet('iso-snake-ghost-on', '0') === '1';

  /* 2.0：存储键统一 iso-snake-* 前缀——旧 snake.* 偏好一次性迁移（旧键保留不删，便于回滚）。
     必须在各表现层模块 init() 读键之前跑；core.js 最先加载，天然满足。 */
  for (const [o, n] of [['snake.theme', 'iso-snake-theme'], ['snake.snd', 'iso-snake-snd'], ['snake.music', 'iso-snake-music'], ['snake.sprint', 'iso-snake-sprint']]) {
    if (safeGet(n, null) === null) { const v = safeGet(o, null); if (v !== null) safeSet(n, v); }
  }

  /* 工具注册进 K 供各表现层模块使用（内部仍用裸名） */
  K.rand = rand; K.safeGet = safeGet; K.safeSet = safeSet; K.nm = nm;
  K.P = P; K.fr = fr; K.rgba = rgba; K.shades = shades;
  K.dateSeed = dateSeed; K.dateStr = dateStr; K.setSeed = setSeed; K.MODE_NAME = MODE_NAME;

  Snake.K = K; Snake.S = S; Snake.bus = bus;
  Snake.hooks = { think: null };
  /* 远征入口：Stage 1 先用 URL / api 直达（工具栏不加控件，见 Stage 1 简报 Q3） */
  function startExpedition(id) {
    S.mode = 'expedition'; S.wins = [0, 0]; S.daily = false; setSeed(0);
    loadLevel(id || S.levelId || 'test-24'); loadBest(); newGame(); bus.emit('hud');
  }
  function setTerrain(on, id) {   // 地形（3D）与模式正交，任何模式都能开关（用户要求：既保留原版、也能随时切升级版）
    S.terrain = !!on;
    if (id) S.levelId = id;
    if (S.terrain) { if (!S.T) loadLevel(S.levelId || 'test-24'); } else S.T = null;
    S.wins = [0, 0]; loadBest(); newGame(); bus.emit('hud');
  }
  Snake.api = { newGame, reset: () => { loadBest(); newGame(); }, start, togglePause, press, setHold, setMode, setSkin, startDaily, setGhostOn, startExpedition, loadLevel, setTerrain, update };
})();
</script>

<script>
/* terrain.js —— 层图：ASCII 解析、校验、层选择与层图 BFS（纯数据，不碰 DOM/CSS/绘制）
   契约：docs/terrain-spec.md §1–§3、§5。核心概念：
     · 一个格子的每一层 = { h, kind, walkable, portal }，格内按 h 升序；桥 = 同格两层（下 ground/water + 上 deck）。
     · 移动选层：目标格可走层里取 |h - 当前层 h| 最小者；同差值优先同层、其次较高层；最小差值 > 1 或目标不可走 ⇒ 不可走。
     · Stage 1 的玩法只用「目标格有没有可走层」这一条硬阻挡；高差/桥下/传送门规则在 Stage 2 开。
   代码里出现的 'I'/'L'（冰/熔岩）在 Stage 4 之前一律抛错，不静默忽略。 */
window.Snake = window.Snake || {};
(function () {
  'use strict';

  /* ---------- ASCII → 层 ---------- */
  function layersOf(ch, x, y) {
    if (ch === 'L') return [{ h: 0, walkable: false, kind: 'lava' }];   // 熔岩：不可走，只做硬阻挡（暂停/重开等规则不受影响）
    if (ch === 'I') return [{ h: 0, walkable: true, kind: 'ice' }];   // 冰面：可走，但一步会滑（滑行规则见 slide / core 的落地计算）
    switch (ch) {
      case '.': case '@': case '$': return [{ h: 0, kind: 'ground', walkable: true, portal: null }];
      case '1': return [{ h: 1, kind: 'ground', walkable: true, portal: null }];
      case '2': return [{ h: 2, kind: 'ground', walkable: true, portal: null }];
      case '3': return [{ h: 3, kind: 'ground', walkable: true, portal: null }];
      case '#': return [{ h: 3, kind: 'wall', walkable: false, portal: null }];
      case '~': return [{ h: 0, kind: 'water', walkable: false, portal: null }];
      case 'B': return [                                   // 桥面 h2 + 下方水（桥下不可通行）
        { h: 0, kind: 'water', walkable: false, portal: null },
        { h: 2, kind: 'deck', walkable: true, portal: null }];
      case 'b': return [                                   // 桥面 h2 + 下方平地 h0（桥下可通行）
        { h: 0, kind: 'ground', walkable: true, portal: null },
        { h: 2, kind: 'deck', walkable: true, portal: null }];
      case 'P': case 'p': case 'Q': case 'q':              // 传送门：成对由字母定义（大小写同属一对）
        return [{ h: 0, kind: 'portal', walkable: true, portal: ch.toLowerCase() }];
      case 'I': case 'L':
        throw new Error(`terrain: 地图里的 '${ch}'（冰/熔岩）要到 Stage 4 才实现，(x=${x},y=${y})`);
      default:
        throw new Error(`terrain: 未知地图字符 '${ch}'，(x=${x},y=${y})`);
    }
  }
  const isWalk = l => !!l && l.walkable;
  /* 出生朝向 → 格方向向量（与 core 的 K.DIRS 同义；terrain 自带一份，便于脱离 core 单测） */
  const DIRV = { upRight: [0, -1], downRight: [1, 0], downLeft: [0, 1], upLeft: [-1, 0] };

  /* 内部：只建层图、不做校验（validate 也要用它 ⇒ 不能写成 build→validate→build 的互相递归） */
  function makeGraph(rows, level) {
    const w = rows[0].length, h = rows.length;
    const cells = [];
    for (let x = 0; x < w; x++) {
      cells[x] = [];
      for (let y = 0; y < h; y++) cells[x][y] = layersOf(rows[y][x], x, y);
    }
    const T = {
      id: level.id, name: level.name, biome: level.biome, w, h, cells,
      spawns: level.spawns.map(s => ({ x: s.x, y: s.y, dir: s.dir })),
      ruleset: level.rulesetVersion,

      at(x, y) { return (x >= 0 && y >= 0 && x < w && y < h) ? cells[x][y] : null; },
      /* 指定层高的层（无则 null） */
      layerAt(x, y, hh) { const a = T.at(x, y); if (!a) return null; for (const l of a) if (l.h === hh) return l; return null; },
      /* 该格最高的可走层（食物/出生落点按此层） */
      topWalk(x, y) { const a = T.at(x, y); if (!a) return null; let best = null; for (const l of a) if (isWalk(l) && (!best || l.h > best.h)) best = l; return best; },
      hasWalk(x, y) { return !!T.topWalk(x, y); },
      /* §3.3 选层：从 fromH 高度进入该格，返回落点层或 null（不可走 / 高差 > 1） */
      pick(x, y, fromH) {
        const a = T.at(x, y); if (!a) return null;
        let best = null;
        for (const l of a) {
          if (!isWalk(l)) continue;
          const dh = Math.abs(l.h - fromH);
          if (dh > 1) continue;
          if (!best || dh < best.dh || (dh === best.dh && l.h === fromH && best.h !== fromH) || (dh === best.dh && l.h > best.h)) best = { h: l.h, dh, layer: l };
        }
        return best;
      },
      /* 传送门出口（Stage 2 用；现在无需参与玩法，但数据要在） */
      portalTo(x, y, letter) {
        for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) {
          const a = cells[i][j]; if (!a) continue;
          for (const l of a) if (l.portal === letter && !(i === x && j === y)) return { x: i, y: j, L: l.h };
        }
        return null;
      },
      /* 占位/访问标记键（取代旧的 x*1024+y —— 层号参与，桥上桥下互不阻挡） */
      key(x, y, L) { return x + ',' + y + ',' + L; },
      /* 层图邻接：只连「四邻落点」＋传送门边，成本 1。
         不给「同格换层」的边：core 的 step() 是 pick(nx,ny,L0) 选层的，原地换层在玩法里不可实现
         （会变成原地不动 ⇒ 自撞），层图里若有这种边，AI 就会选到走不出来的步。 */
      neighbors(x, y, L) {
        const out = [];
        const cur = T.layerAt(x, y, L);
        const fromH = cur ? cur.h : L;
        const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
        for (const [dx, dy] of dirs) {
          const p = T.pick(x + dx, y + dy, fromH);
          if (p) out.push({ x: x + dx, y: y + dy, L: p.h, cost: 1, portal: false });
        }
        const cur2 = T.layerAt(x, y, fromH);
        if (cur2 && cur2.kind === 'portal' && cur2.portal) {   // 传送门＝层图上的双向边（规格 §3.4），不是瞬移特判
          const pe = T.portalTo(x, y, cur2.portal);
          if (pe) out.push({ x: pe.x, y: pe.y, L: pe.L, cost: 1, portal: true });
        }
        return out;
      },
      /* 层图 BFS：从 (x,y,L) 出发，返回 Map(key → 距离)；pred 可选，用于过滤节点 */
      reachable(x, y, L, pred) {
        const dist = new Map();
        if (!T.hasWalk(x, y)) return dist;
        const start = T.key(x, y, L);
        dist.set(start, 0);
        const q = [[x, y, L]];
        for (let qi = 0; qi < q.length; qi++) {
          const [cx, cy, cL] = q[qi], d = dist.get(T.key(cx, cy, cL));
          for (const n of T.neighbors(cx, cy, cL)) {
            if (pred && !pred(n)) continue;
            const k = T.key(n.x, n.y, n.L);
            if (dist.has(k)) continue;
            dist.set(k, d + 1); q.push([n.x, n.y, n.L]);
          }
        }
        return dist;
      },
      /* 全部可走层节点（校验与统计用） */
      walkables() {
        const out = [];
        for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) for (const l of cells[x][y]) if (isWalk(l)) out.push({ x, y, L: l.h, kind: l.kind, portal: l.portal });
        return out;
      },
      /* 层节点总数（含不可走层） */
      nodeCount() { let n = 0; for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) n += cells[x][y].length; return n; },
      /* 静态层要画的「块」：不可走层与高于地面的可走层都算（Stage 1 灰模：h≥1 的台子 + 墙） */
      isBlock(l) { return !isWalk(l) || l.h > 0; }
    };
    return T;
  }

  /* 对外建图：先校验（不合法直接抛错），再建层图 */
  function build(level) {
    validate(level.map);
    /* 出生点身后的 2 格要留给初始蛇身（validate 只看地图，不知道朝向，这里按关卡数据补一道守卫） */
    (level.spawns || []).forEach((s, i) => {
      const d = DIRV[s.dir] || DIRV.downRight;
      for (let k = 1; k <= 2; k++) {
        const x = s.x - d[0] * k, y = s.y - d[1] * k;
        if (!layersOf(level.map[y][x], x, y).some(isWalk)) throw new Error(`terrain.build: 出生点 ${i} (${s.x},${s.y}) 身后第 ${k} 格 (${x},${y}) 不可走——初始蛇身会嵌进墙里`);
      }
    });
    return makeGraph(level.map, level);
  }

  /* ---------- 校验：任何一条不满足就抛错，绝不静默补齐 ---------- */
  function validate(rows) {
    const bad = m => { throw new Error('terrain.validate: ' + m); };
    if (!Array.isArray(rows) || !rows.length) bad('地图为空');
    const h = rows.length, w = rows[0].length;
    if (w < 3 || h < 3) bad(`地图太小（${w}×${h}）`);
    rows.forEach((r, y) => { if (typeof r !== 'string' || r.length !== w) bad(`第 ${y} 行长度 ${r && r.length} ≠ ${w}（每行必须等长）`); });

    /* 逐字符先过一遍：未知字符与未实现字符直接抛（layersOf 负责） */
    const spawns = { '@': [], '$': [] };
    const portals = new Map();
    let cells2 = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x], ls = layersOf(ch, x, y);
      if (ls.length > 2) bad(`(x=${x},y=${y}) 层数 ${ls.length} > 2`);
      cells2++;
      if (ch === '@' || ch === '$') spawns[ch].push({ x, y });
      const p = ls.find(l => l.portal);
      if (p) { const k = p.portal; if (!portals.has(k)) portals.set(k, []); portals.get(k).push({ x, y }); }
      /* 桥/台子：有 deck 必须有下层 */
      if (ls.some(l => l.kind === 'deck') && ls.length < 2) bad(`(x=${x},y=${y}) 桥面缺少下层`);
      /* 层高序 */
      for (let i = 1; i < ls.length; i++) if (ls[i].h <= ls[i - 1].h) bad(`(x=${x},y=${y}) 层未按 h 升序`);
    }
    if (spawns['@'].length !== 1) bad(`P1 出生点 '@' 必须恰好 1 个（当前 ${spawns['@'].length}）`);
    if (spawns['$'].length !== 1) bad(`P2 出生点 '$' 必须恰好 1 个（当前 ${spawns['$'].length}）`);

    /* 四周封闭：边界格不得有可走层 */
    const walkRow = (x, y) => layersOf(rows[y][x], x, y).some(isWalk);
    for (let x = 0; x < w; x++) { if (walkRow(x, 0) || walkRow(x, h - 1)) bad(`边界未封闭（第 ${walkRow(x, 0) ? 0 : h - 1} 行 x=${x} 可走）`); }
    for (let y = 0; y < h; y++) { if (walkRow(0, y) || walkRow(w - 1, y)) bad(`边界未封闭（x=${walkRow(0, y) ? 0 : w - 1} 列 y=${y} 可走）`); }

    /* 出生点必须有 3 格直线跑道（任一方向） */
    const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    for (const ch of ['@', '$']) {
      const s = spawns[ch][0];
      const ok = dirs.some(([dx, dy]) => {
        for (let i = 1; i <= 3; i++) {
          const x = s.x + dx * i, y = s.y + dy * i;
          if (x < 0 || y < 0 || x >= w || y >= h) return false;
          if (!layersOf(rows[y][x], x, y).some(isWalk)) return false;
        }
        return true;
      });
      if (!ok) bad(`${ch} 出生点 (${s.x},${s.y}) 没有 3 格直线跑道`);
    }

    /* 传送门成对且两端可走 */
    for (const [k, list] of portals) {
      if (list.length !== 2) bad(`传送门 '${k}' 必须恰好两端（当前 ${list.length}）`);
      list.forEach(({ x, y }) => { if (!layersOf(rows[y][x], x, y).some(isWalk)) bad(`传送门 '${k}' 的 (${x},${y}) 不可走`); });
    }

    /* 可达性：用与玩法同一套选层规则建层图，全部可走层节点必须从某个出生点可达 */
    const probe = makeGraph(rows, { id: 'probe', name: 'probe', biome: 'grey', map: rows, spawns: [{ x: spawns['@'][0].x, y: spawns['@'][0].y, dir: 'downRight' }], rulesetVersion: 1 });
    const seen = new Set();
    const s0 = probe.topWalk(spawns['@'][0].x, spawns['@'][0].y);
    for (const [k, dist] of probe.reachable(spawns['@'][0].x, spawns['@'][0].y, s0.h)) { seen.add(k); }
    const unreachable = probe.walkables().filter(n => !seen.has(probe.key(n.x, n.y, n.L)));
    if (unreachable.length) {
      const u = unreachable[0];
      bad(`有 ${unreachable.length} 个可走层节点从 P1 出生点不可达（例如 x=${u.x},y=${u.y},L=${u.L},kind=${u.kind}）`);
    }
    return { w, h, nodes: probe.nodeCount(), walkable: probe.walkables().length };
  }

  
  /* 冰面 transition：从 (x,y,L) 朝 dir 迈一步后，只要落在冰上就继续同向滑。
     返回 { x, y, L, path }：path 为经过的格（不含起点），终点是停下时所在的可走格；
     遇到不可走/高差 >1/传送门 ⇒ 停在上一格（绝不进入非法格）。AI 与 core 都要用这张表。 */
  function slide(T, x, y, L, dir, max) {
    const lim = max || 64;
    let cx = x, cy = y, cL = L;
    const path = [];
    for (let i = 0; i < lim; i++) {
      const nx = cx + dir[0], ny = cy + dir[1];
      const l = T.layerAt(nx, ny, L);
      const p = T.pick(nx, ny, cL);                 // §3.3 选层：高差 >1 或不可走都返回 null
      if (!p || (l && l.kind === 'portal')) break;  // 撞墙/悬崖/门 ⇒ 停在原地
      cx = nx; cy = ny; cL = p.h; path.push({ x: cx, y: cy, L: cL });
      if (p.layer && p.layer.kind !== 'ice') break; // 落在非冰上 ⇒ 正常一步，滑行结束
    }
    return { x: cx, y: cy, L: cL, path };
  }
  Snake.Terrain = { build, validate, layersOf , slide };

})();
</script>
<script>
/* themes.js —— 主题注册表（纯数据驱动）+ 应用/切换/持久化
   新增主题 = 在 LIST 里追加一个对象；其余逻辑零改动。 */
window.Snake = window.Snake || {};
(function () {
  'use strict';
  const K = Snake.K, bus = Snake.bus;
  const KEY = 'iso-snake-theme', DEF = 'neon-night';   // 2.0 起统一 iso-snake-* 前缀（旧 snake.theme 由 core.js 启动时一次性迁移）

  /* css: 7 个 UI 变量覆盖值；canvas: 8 色渲染调色板（render.js 只读） */
  const LIST = [
    { id: 'neon-night', name: '霓虹夜', css: { bg: '#060a14', fg: '#e6ecff', muted: '#7f8fb5', f1: '#0a1122', f2: '#0c142a', edge: '#1b2a55', btn: '#0d1530' },
      canvas: { floorTop: '#0d1528', floorLeft: '#0a1122', floorRight: '#080d1d', grid: 'rgba(80,220,255,.18)', glow: '#3b82f6', food: '#ff7a45', star: '#cdd9ff', spark: '#3b82f6' }, pattern: 'pulse' },
    { id: 'glacier', name: '冰川', css: { bg: '#eef6fa', fg: '#16324a', muted: '#5e7d93', f1: '#dbeef6', f2: '#cfe6f1', edge: '#aec9d9', btn: '#ffffff' },
      canvas: { floorTop: '#e2f1f8', floorLeft: '#d3e9f3', floorRight: '#c5e0ec', grid: 'rgba(56,189,248,.22)', glow: '#38bdf8', food: '#ff6b6b', star: null, spark: '#38bdf8' }, pattern: 'ice' },
    { id: 'cyber', name: '赛博', css: { bg: '#0d0221', fg: '#f5e6ff', muted: '#8f7bb0', f1: '#150534', f2: '#190741', edge: '#3b1e6e', btn: '#17053c' },
      canvas: { floorTop: '#1c0742', floorLeft: '#17053a', floorRight: '#140434', grid: 'rgba(232,121,249,.20)', glow: '#e879f9', food: '#facc15', star: '#b78cff', spark: '#e879f9' }, pattern: 'circuit' },
    { id: 'candy', name: '糖果', css: { bg: '#fff5f9', fg: '#5c2b43', muted: '#b07a92', f1: '#ffe4ee', f2: '#ffd9e7', edge: '#f3bcd2', btn: '#ffffff' },
      canvas: { floorTop: '#ffe7f1', floorLeft: '#ffd9ea', floorRight: '#f9cfe2', grid: 'rgba(236,72,153,.20)', glow: '#ec4899', food: '#22c55e', star: null, spark: '#ec4899' }, pattern: 'sprinkle' },
    { id: 'lava', name: '熔岩', css: { bg: '#160707', fg: '#ffe2d6', muted: '#b08678', f1: '#200c0c', f2: '#251010', edge: '#57201c', btn: '#280f0d' },
      canvas: { floorTop: '#2c1411', floorLeft: '#260f0d', floorRight: '#210c0b', grid: 'rgba(249,115,22,.22)', glow: '#f97316', food: '#fbbf24', star: '#ffb199', spark: '#fb923c' }, pattern: 'ember' },
    { id: 'forest', name: '森林', css: { bg: '#0c1610', fg: '#ddf5e6', muted: '#7fa98f', f1: '#0f1f15', f2: '#12251a', edge: '#1f4a33', btn: '#122619' },
      canvas: { floorTop: '#172c20', floorLeft: '#13251a', floorRight: '#101f16', grid: 'rgba(16,185,129,.22)', glow: '#10b981', food: '#f59e0b', star: '#bfe8d2', spark: '#34d399' }, pattern: 'moss' },
    { id: 'desert', name: '沙漠', css: { bg: '#faf3e4', fg: '#4a3620', muted: '#9d8a6b', f1: '#f5e8cd', f2: '#efdfc0', edge: '#dcc9a3', btn: '#fffaf0' },
      canvas: { floorTop: '#f5e7ca', floorLeft: '#eeddbb', floorRight: '#e6d2ab', grid: 'rgba(245,158,11,.25)', glow: '#f59e0b', food: '#dc2626', star: null, spark: '#fbbf24' }, pattern: 'ripple' }
  ];

  const byId = id => LIST.find(t => t.id === id) || null;
  let current = byId(DEF), dots = [];

  function apply(id, persist) {
    const t = byId(id) || byId(DEF);
    if (!t) { console.warn('[themes] 非法主题 id:', id); return; }
    current = t;
    const s = document.documentElement, v = { '--bg': t.css.bg, '--fg': t.css.fg, '--muted': t.css.muted, '--f1': t.css.f1, '--f2': t.css.f2, '--edge': t.css.edge, '--btn': t.css.btn };
    Object.keys(v).forEach(k => s.style.setProperty(k, v[k]));       // 覆盖 base.css 默认变量
    s.dataset.theme = t.id;
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t.css.bg);
    if (persist) K.safeSet(KEY, t.id);
    dots.forEach(d => d.classList.toggle('on', d.dataset.th === t.id));
    bus.emit('themeChange', { id: t.id });
  }

  function init() { // 渲染主题色点行（模式栏下），并应用记忆/URL 主题
    const bar = document.querySelector('.th');
    if (bar) {
      bar.innerHTML = '';
      LIST.forEach(t => {
        const b = document.createElement('button');
        b.className = 'dot'; b.dataset.th = t.id; b.style.background = t.css.bg;
        b.title = t.name; b.setAttribute('aria-label', '主题 ' + t.name);
        b.addEventListener('click', () => { b.blur(); apply(t.id, true); });
        bar.appendChild(b); dots.push(b);
      });
    }
    const qs = new URLSearchParams(location.search).get('theme');
    const init = byId(qs) ? qs : (byId(K.safeGet(KEY, DEF)) ? K.safeGet(KEY, DEF) : DEF);
    apply(qs ? qs : init, !qs);              // ?theme= 仅本次生效，不覆盖记忆
  }

  Snake.theme = { list: LIST, get current() { return current; }, apply, init };
})();
</script>
<script>
/* patterns.js —— 地板图案注册表（纯函数；由 render 的 paintBoard 在离屏缓存里调用，每帧零成本）
   新增图案 = PAT 加一个函数 + 主题数据写 pattern id；核心/render 零改动。查无 id 静默 no-op。 */
window.Snake = window.Snake || {};
(function () {
  'use strict';
  const K = Snake.K, fr = K.fr;
  function pulse(c, cx, cy, p, x, y) { // 霓虹夜：脉冲网格
    if ((x * 7 + y * 13) % 5) return;
    c.strokeStyle = K.rgba(p.glow, .35); c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx, cy - K.HH * .45); c.lineTo(cx + K.HW * .45, cy); c.lineTo(cx, cy + K.HH * .45); c.lineTo(cx - K.HW * .45, cy); c.closePath(); c.stroke();
    c.fillStyle = K.rgba(p.glow, .5); c.fillRect(cx - 1, cy - 1, 2, 2);
  }
  function ice(c, cx, cy, p, x, y) { // 冰川：裂纹
    if (fr(x * 3 + y * 5 + 1) <= .6) return;
    const a = fr(x * 5 + y * 7 + 2) * 6.283;
    c.strokeStyle = K.rgba(p.glow, .3); c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx + Math.cos(a) * K.HW * .8, cy + Math.sin(a) * K.HH * .8);
    c.lineTo(cx + (fr(x + y * 2) - .5) * 6, cy + (fr(x * 2 + y) - .5) * 4); c.lineTo(cx, cy); c.stroke();
  }
  function circuit(c, cx, cy, p, x, y) { // 赛博：电路走线+节点
    if ((x + y) % 4) return;
    c.strokeStyle = K.rgba(p.glow, .35); c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx - K.HW * .8, cy); c.lineTo(cx, cy); c.lineTo(cx, cy - K.HH * .8); c.stroke();
    c.fillStyle = K.rgba(p.glow, .5); c.fillRect(cx - 1, cy - 1, 2, 2);
  }
  function sprinkle(c, cx, cy, p, x, y) { // 糖果：糖粒短棒
    for (let i = 0; i < 3; i++) {
      const s = x * 11 + y * 17 + i * 5;
      const bx = cx + (fr(s) - .5) * K.HW * 1.2, by = cy + (fr(s + 1) - .5) * K.HH * 1.2;
      const a = fr(s + 2) * 3.14, len = 2 + fr(s + 3) * 2;
      c.strokeStyle = K.rgba(i % 2 ? p.spark : p.food, .35); c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + Math.cos(a) * len, by + Math.sin(a) * len * .5); c.stroke();
    }
  }
  function moss(c, cx, cy, p, x, y) { // 森林：苔藓斑
    const n = 4 + Math.floor(fr(x * 13 + y * 7) * 3);
    c.fillStyle = K.rgba(p.spark, .3);
    for (let i = 0; i < n; i++) { const s = x * 7 + y * 11 + i * 3; c.fillRect(cx + (fr(s) - .5) * K.HW * 1.4, cy + (fr(s + 1) - .5) * K.HH * 1.4, 1.5, 1.5); }
  }
  function ember(c, cx, cy, p, x, y) { // 熔岩：余烬裂
    c.strokeStyle = K.rgba(p.glow, .3); c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx - K.HW * .7, cy + (fr(x + y) - .5) * 4);
    c.lineTo(cx - K.HW * .2, cy + (fr(x * 3 + y) - .5) * 5);
    c.lineTo(cx + K.HW * .3, cy + (fr(x + y * 3) - .5) * 5);
    c.lineTo(cx + K.HW * .7, cy + (fr(x * 2 + y * 2) - .5) * 4); c.stroke();
    if (fr(x * 5 + y * 9) > .7) { c.fillStyle = K.rgba(p.food, .5); c.fillRect(cx - 1, cy - 1, 2, 2); }
  }
  function ripple(c, cx, cy, p, x, y) { // 沙漠：沙纹同心弧（下半）
    c.strokeStyle = K.rgba(p.glow, .25); c.lineWidth = 1;
    [.3, .6].forEach(k => { c.beginPath(); c.moveTo(cx - K.HW * k, cy); c.lineTo(cx, cy + K.HH * k); c.lineTo(cx + K.HW * k, cy); c.stroke(); });
  }
  const PAT = { pulse, ice, circuit, sprinkle, moss, ember, ripple };
  Snake.Patterns = { draw: (id, c, cx, cy, p, x, y) => { const f = PAT[id]; if (f) f(c, cx, cy, p, x, y); } };
})();

</script>
<script>
/* audio.js —— WebAudio 全合成音效 + 可选 BGM（零音频资源文件）
   音效：吃食（随连击升调）/ 冲刺（6 套可切换，循环）/ 撞击 / 获胜和弦 / 失败下行音。「音乐」默认关。
   冲刺音色注册表 SPRINTS：新增音色 = 追加一条 {id,name,build}；选择持久化于 localStorage 'iso-snake-sprint'。 */
window.Snake = window.Snake || {};
(function () {
  'use strict';
  const K = Snake.K, bus = Snake.bus;
  let ac = null, soundOn = true, musicOn = false;
  const winds = {};                       // 冲刺呼啸循环节点，按玩家编号
  let bgmTimer = null, bgmStep = 0;
  const BGM_SEQ = [261.63, 329.63, 392.00, 329.63, 246.94, 311.13, 369.99, 311.13]; // C-E-G-E-B-D-F#‑D 轻柔琶音
  const BGM_STEP = 320;                   // ≈ 90 BPM 八分

  function ctx() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }          // 不支持 WebAudio → 整体静默降级
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => ctx(), { passive: true }));

  function env(g, t0, vol, dur) {         // 简易包络：起音 → 指数衰减
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function tone(type, f0, f1, dur, vol) { // 振荡器音
    if (!soundOn) return; const a = ctx(); if (!a) return;
    try {
      const t0 = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t0);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      env(g, t0, vol || .12, dur);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + .02);
    } catch (e) {}
  }
  function noise(dur, vol, f0, f1) {      // 白噪声 → 带通扫频
    const a = ctx(); if (!a) return;
    try {
      const t0 = a.currentTime, n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const s = a.createBufferSource(); s.buffer = b;
      const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1; f.frequency.setValueAtTime(f0, t0);
      if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      const g = a.createGain(); env(g, t0, vol, dur);
      s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
    } catch (e) {}
  }
  /* ---------- 合成原语（冲刺音色共用） ---------- */
  let nbuf = null;
  function nbufGet(a) {                   // 2 秒白噪声循环缓冲，全局复用
    if (!nbuf) {
      nbuf = a.createBuffer(1, Math.floor(a.sampleRate * 2), a.sampleRate);
      const d = nbuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return nbuf;
  }
  function osc(a, type, f0, f1, ramp, t0) { // 振荡器（指数扫频）
    const o = a.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + ramp);
    o.start(t0); return o;
  }
  function nz(a, t0) { const s = a.createBufferSource(); s.buffer = nbufGet(a); s.loop = true; s.start(t0); return s; }
  function filt(a, type, freq, q) { const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q; return f; }
  function sweep(a, f0, f1, q, ramp, t0) { // 带通扫频
    const f = filt(a, 'bandpass', f0, q);
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + ramp);
    return f;
  }
  function fadeIn(a, t0, vol, atk) {      // 起音包络（冲刺节点统一用它淡入）
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (atk || .06));
    return g;
  }
  function lay(a, t0, m, node, rel) { const g = fadeIn(a, t0, rel, .06); node.connect(g); g.connect(m); return g; } // 层 → 相对增益 → 总线
  function lfo(a, target, freq, type, depth, t0) { // 调制增益（AM）或频率（颤音）
    const o = a.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = a.createGain(); g.gain.value = depth;
    o.connect(g); g.connect(target); o.start(t0);
    return { o, g };
  }

  /* ---------- 冲刺音色注册表：6 套可选（纯数据驱动，新增只需追加一条） ---------- */
  const SPRINTS = [
    { id: 'b', name: '喷气', build: function (a, t0) { // 三角波中频上扫，柔和通透
      const m = fadeIn(a, t0, .20, .08); m.connect(a.destination);
      const o = osc(a, 'triangle', 180, 760, .45, t0), f = filt(a, 'lowpass', 2400);
      o.connect(f); lay(a, t0, m, f, .9);
      return { srcs: [o], g: m };
    } },
    { id: 'c', name: '蓄能', build: function (a, t0) { // 正弦上扫 + 13Hz 颤音，充能电子感
      const m = fadeIn(a, t0, .20, .08); m.connect(a.destination);
      const o = osc(a, 'sine', 130, 1050, .45, t0); lay(a, t0, m, o, .9);
      return { srcs: [o], g: m, mods: [lfo(a, m.gain, 13, 'sine', .09, t0)] };
    } },
    { id: 'f', name: '街机', build: function (a, t0) { // 方波上扫 + 低八度，8-bit 加速感
      const m = fadeIn(a, t0, .18, .08); m.connect(a.destination);
      const o1 = osc(a, 'square', 110, 880, .4, t0), f1 = filt(a, 'lowpass', 2600); o1.connect(f1); lay(a, t0, m, f1, .8);
      const o2 = osc(a, 'square', 55, 440, .4, t0), f2 = filt(a, 'lowpass', 1400); o2.connect(f2); lay(a, t0, m, f2, .5);
      return { srcs: [o1, o2], g: m, mods: [lfo(a, m.gain, 26, 'triangle', .063, t0)] };
    } },
    { id: 'g', name: '脉冲', build: function (a, t0) { // 带通噪底 + 低频锯齿 + 16Hz 方波脉冲
      const m = fadeIn(a, t0, .24, .08); m.connect(a.destination);
      const n = nz(a, t0), b = sweep(a, 500, 2600, 2, .5, t0); n.connect(b); lay(a, t0, m, b, .7);
      const o = osc(a, 'sawtooth', 70, 210, .5, t0), f = filt(a, 'lowpass', 700); o.connect(f); lay(a, t0, m, f, .5);
      return { srcs: [n, o], g: m, mods: [lfo(a, m.gain, 16, 'square', .19, t0)] };
    } },
    { id: 'h', name: '引擎', build: function (a, t0) { // 三层失谐锯齿 + 低通扫频 + 气流，低频最厚
      const m = fadeIn(a, t0, .24, .08); m.connect(a.destination);
      const s1 = osc(a, 'sawtooth', 55, 180, .55, t0),
            s2 = osc(a, 'sawtooth', 55.55, 181.8, .55, t0),
            s3 = osc(a, 'sawtooth', 54.45, 178.2, .55, t0);
      const f = filt(a, 'lowpass', 300);
      f.frequency.setValueAtTime(300, t0); f.frequency.linearRampToValueAtTime(1700, t0 + .55);
      s1.connect(f); s2.connect(f); s3.connect(f); lay(a, t0, m, f, .9);
      const n = nz(a, t0), b = sweep(a, 400, 2400, 1, .5, t0), ng = fadeIn(a, t0, .22, .06);
      n.connect(b); b.connect(ng); ng.connect(m);
      return { srcs: [s1, s2, s3, n], g: m, mods: [lfo(a, s1.frequency, 7, 'sine', 10, t0)] };
    } },
    { id: 'i', name: '电弧', build: function (a, t0) { // 高通锯齿 + 高频噼啪 + 31Hz 调制，电流感
      const m = fadeIn(a, t0, .20, .08); m.connect(a.destination);
      const o = osc(a, 'sawtooth', 60, 380, .5, t0), hp = filt(a, 'highpass', 200); o.connect(hp); lay(a, t0, m, hp, .85);
      const n = nz(a, t0), b = sweep(a, 2600, 5600, 8, .4, t0), ng = fadeIn(a, t0, .30, .06);
      n.connect(b); b.connect(ng); ng.connect(m);
      return { srcs: [o, n], g: m, mods: [lfo(a, m.gain, 31, 'square', .10, t0)] };
    } }
  ];
  const SPR_IDS = SPRINTS.map(s => s.id), SPR_DEF = 'b';
  let sprintId = SPR_DEF;
  const sprSpec = () => SPRINTS[Math.max(0, SPR_IDS.indexOf(sprintId))];

  function windStart(i) {                 // 冲刺呼啸：按当前选择的音色建循环，冲刺期间持续
    if (!soundOn) return; const a = ctx(); if (!a || winds[i]) return;
    try { winds[i] = sprSpec().build(a, a.currentTime); } catch (e) {}
  }
  function windStop(i) {
    const w = winds[i]; if (!w) return;
    try {
      const a = ctx(), t0 = a ? a.currentTime : 0;
      (w.mods || []).forEach(mm => { // 先摘掉调制，避免释放段增益被 LFO 拉偏
        try { mm.g.gain.cancelScheduledValues(t0); mm.g.gain.setValueAtTime(0, t0); mm.o.stop(t0 + .2); } catch (e) {}
      });
      w.g.gain.cancelScheduledValues(t0);
      w.g.gain.setValueAtTime(Math.max(w.g.gain.value, .0001), t0);
      w.g.gain.exponentialRampToValueAtTime(.0001, t0 + .15);
      w.srcs.forEach(s => { try { s.stop(t0 + .2); } catch (e) {} });
    } catch (e) {}
    delete winds[i];
  }
  function stopAllWinds() { Object.keys(winds).forEach(i => windStop(+i)); }
  /* ---------- BGM：三角波琶音循环，低增益 ---------- */
  function bgmTick() {
    if (!musicOn) return; const a = ctx(); if (!a) return;
    const f = BGM_SEQ[bgmStep++ % BGM_SEQ.length];
    try {
      const t0 = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, t0);
      env(g, t0, .045, .52);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + .56);
    } catch (e) {}
  }
  function bgmStart() { if (!bgmTimer && musicOn) { bgmTick(); bgmTimer = setInterval(bgmTick, BGM_STEP); } }
  function bgmStop() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  function init() {
    soundOn = K.safeGet('iso-snake-snd', '1') !== '0';
    musicOn = K.safeGet('iso-snake-music', '0') === '1';
    const snd = document.getElementById('snd'), mus = document.getElementById('mus');
    const label = (b, on, t) => { b.textContent = t; b.classList.toggle('off', !on); b.title = t + '：' + (on ? '开' : '关'); };   // 短文案省宽度，开关态用 .off 置灰 + title
    label(snd, soundOn, '音效'); label(mus, musicOn, '音乐');
    snd.addEventListener('click', e => {
      soundOn = !soundOn; K.safeSet('iso-snake-snd', soundOn ? '1' : '0'); label(snd, soundOn, '音效'); snd.blur();
      if (!soundOn) stopAllWinds();
    });
    mus.addEventListener('click', e => {
      musicOn = !musicOn; K.safeSet('iso-snake-music', musicOn ? '1' : '0'); label(mus, musicOn, '音乐'); mus.blur();
      musicOn ? bgmStart() : bgmStop();
    });
    sprintId = K.safeGet('iso-snake-sprint', SPR_DEF);       // 冲刺音色：选择持久化，非法值回退默认
    if (SPR_IDS.indexOf(sprintId) < 0) sprintId = SPR_DEF;
    const spr = document.getElementById('spr');
    if (spr) {
      spr.value = sprintId;
      spr.addEventListener('change', () => { sprintId = spr.value; K.safeSet('iso-snake-sprint', sprintId); spr.blur(); });
    }
    bus.on('eat', e => {   // 吃食：基础音高随连击阶梯升调（上限后循环）；金苹果 = 高音闪烁琶音
      if (e.gold) { [880, 1174.66, 1567.98].forEach((f, k) => setTimeout(() => tone('triangle', f, f, .12, .1), k * 55)); return; }
      const h = 440 * Math.pow(2, (Math.min(e.streak, 10) - 1) / 12);
      tone('sine', h, h * 1.5, .18, .16);
    });
    bus.on('sprintOn', e => windStart(e.i));
    bus.on('sprintOff', e => windStop(e.i));
    bus.on('sprintLock', e => { windStop(e.i); tone('square', 300, 120, .22, .06); });
    bus.on('crash', () => { stopAllWinds(); noise(.3, .28, 900, 180); });
    bus.on('port', () => [660, 990, 1320].forEach((f, k) => setTimeout(() => tone('sine', f, f * 1.35, .12, .09), k * 45)));   // 传送门：上行三连音（听感上「嗖」一下）
    bus.on('win', () => [523.25, 659.25, 783.99].forEach((f, k) => setTimeout(() => tone('triangle', f, f, .24, .14), k * 110))); // 上行大三和弦三连音
    bus.on('lose', () => [392, 261.63].forEach((f, k) => setTimeout(() => tone('sine', f, f * .96, .3, .12), k * 200)));   // 下行双音
    if (musicOn) bgmStart();
  }
  Snake.Audio = { init };
})();
</script>
<script>
/* particles.js —— 固定容量对象池粒子（容量 256，超限覆盖最旧，零 GC 压力）
   只听 bus 事件出特效，不改游戏状态；绘制由 render 每帧调用。 */
window.Snake = window.Snake || {};
(function () {
  'use strict';
  const S = Snake.S, K = Snake.K, bus = Snake.bus;
  const CAP = 256;
  const pool = Array.from({ length: CAP }, () => ({ alive: false, x: 0, y: 0, vx: 0, vy: 0, g: 90, age: 0, life: 1, size: 2, col: '#fff', spin: 4, rot: 0, damp: .99 }));
  let head = 0; // 环写：满了覆盖最旧

  function spawn(o) {
    const p = pool[head]; head = (head + 1) % CAP;
    p.alive = true; p.age = 0; p.rot = 0;
    p.x = o.x; p.y = o.y; p.vx = o.vx; p.vy = o.vy; p.life = o.life;
    p.size = o.size || 2; p.col = o.col; p.g = o.g === undefined ? 90 : o.g;
    p.spin = o.spin || 4; p.damp = o.damp || .99;
  }
  const pal = () => Snake.theme.current.canvas;
  // 屏幕坐标：优先用渲染层的相机+抬升投影（远征才有），渲染层还没加载时退回 core 的 K.P
  const at = (x, y, L) => (Snake.Render && Snake.Render.toScreen) ? Snake.Render.toScreen(x, y, L) :
    (() => { const [sx, sy] = K.P(x, y); return [sx, sy + K.HH - 6]; })();
  function scatter(cx, cy, n, cols, up, spd) { // 中心散射：up 越大越向上，spd 为速度基数
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, v = spd * (.4 + Math.random() * .6);
      spawn({ x: cx + (Math.random() - .5) * 6, y: cy + (Math.random() - .5) * 4, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .6 - up * (.5 + Math.random() * .5), life: .5 + Math.random() * .4, col: cols[K.rand(cols.length)], size: 2 + Math.random() * 1.5 });
    }
  }
  /* ---------- 事件 → 效果（lowFx 降级表见 spec §2.2） ---------- */
  bus.on('eat', e => { // 吃食爆炸：food+spark 色；金苹果金色大爆；lowFx 减半
    const c = pal(), [cx, cy] = at(e.x, e.y, e.L);
    if (e.gold) { scatter(cx, cy, S.lowFx ? 10 : 22, ['#F2B33D', '#F7D070', '#BA7517', '#ffffff'], 90, 80); return; }
    scatter(cx, cy, S.lowFx ? 6 : 12, e.pk ? ['#ffffff', '#cbd5e1', '#94a3b8'] : [c.food, K.shades(c.food)[0], c.spark], 60, 55);
  });
  bus.on('goldSpawn', e => { // 金苹果登场微光
    const [cx, cy] = at(e.x, e.y, e.L);
    scatter(cx, cy, S.lowFx ? 3 : 7, ['#F2B33D', '#F7D070'], 30, 35);
  });
  bus.on('crash', e => { // 撞击火花：lowFx 减半
    const c = pal(), cols = [c.spark, '#ffffff', K.shades(c.spark)[2]];
    (e.heads || []).forEach(h => { const [cx, cy] = at(h.x, h.y, h.L); scatter(cx, cy, S.lowFx ? 10 : 20, cols, 90, 75); });
  });
  bus.on('port', e => { // 传送门：落点大爆、起点小爆（两端都要看得见，规格 §3.4）
    const [x2, y2] = at(e.tx, e.ty, e.tL), [x1, y1] = at(e.x, e.y, e.L);
    scatter(x2, y2, S.lowFx ? 8 : 18, ['#7FD4FF', '#BFF0FF', '#ffffff'], 55, 70);
    scatter(x1, y1, S.lowFx ? 3 : 8, ['#7FD4FF', '#ffffff'], 25, 45);
  });
  bus.on('win', () => { // 对战获胜烟花：3 轮 × 14 粒；lowFx 1 轮
    const c = pal(), cols = [c.spark, K.shades(c.spark)[0], K.shades(c.spark)[2], c.food, K.shades(c.food)[0]];
    const rounds = S.lowFx ? 1 : 3;
    for (let r = 0; r < rounds; r++) setTimeout(() => scatter(S.W / 2, S.H / 2 - 24 - r * 12, 14, cols, 110 + r * 35, 85 + r * 20), r * 320);
  });
  /* 冲刺拖尾：render 每帧对冲刺中的蛇调用（限速约 20 粒/秒；lowFx 关闭，保留电弧） */
  const acc = [0, 0];
  function trail(p, i, dt) {
    if (S.lowFx) return;
    acc[i] += dt;
    while (acc[i] > .05) {
      acc[i] -= .05;
      const t = p.body[p.body.length - 1];
