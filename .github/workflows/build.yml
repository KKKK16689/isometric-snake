# 只验证；提交、推送与发布由作者确认后手动执行。
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 也可在仓库 Actions 页面手动点 Run workflow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 产物漂移检查（不写入）
        run: npm run build:check
      - name: 无头逻辑测试
        run: npm test
      - name: 安装测试浏览器
        run: npx playwright install --with-deps chromium
      - name: 桌面及手机尺寸回归
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: output/playwright/
