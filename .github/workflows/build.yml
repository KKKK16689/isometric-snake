# 自动构建：只要 src/ 或 build.js 有改动，CI 就跑 build.js 并把生成的 index.html 提交回 main
name: build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'package.json'
  workflow_dispatch: # 也可在仓库 Actions 页面手动点 Run workflow

permissions:
  contents: write # 需要把构建产物提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 打包单文件
        run: node build.js
      - name: 产物有变化才提交
        run: |
          if git diff --quiet; then
            echo "index.html 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(build): 自动打包 index.html [skip ci]"
          git push
